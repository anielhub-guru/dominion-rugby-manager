<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dominion League Manager</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      /* Boot loader: lives inside #app and is wiped by the first render. Inline so it paints before the CSS/JS bundles arrive. */
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: #0e1412; color: #6f8a77; font: 12px ui-monospace, Menlo, Consolas, monospace; letter-spacing: .25em; }
      .boot svg { width: 96px; height: 96px; animation: boot-spin 1.1s cubic-bezier(.5, .1, .5, .9) infinite, boot-bob 1.1s ease-in-out infinite; }
      .boot .shadow { width: 56px; height: 8px; border-radius: 50%; background: #000; opacity: .45; margin-top: -6px; animation: boot-shadow 1.1s ease-in-out infinite; }
      .boot b { font-weight: 400; animation: boot-pulse 1.4s ease-in-out infinite; }
      @keyframes boot-spin { to { rotate: 360deg; } }
      @keyframes boot-bob { 0%, 100% { translate: 0 10px; } 50% { translate: 0 -14px; } }
      @keyframes boot-shadow { 0%, 100% { transform: scale(1); opacity: .45; } 50% { transform: scale(.55); opacity: .2; } }
      @keyframes boot-pulse { 50% { opacity: .35; } }
      @media (prefers-reduced-motion: reduce) { .boot svg, .boot .shadow { animation: none; } }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot" role="status" aria-label="Loading">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <g transform="rotate(-35 50 50)">
            <ellipse cx="50" cy="50" rx="44" ry="27" fill="#8fe3a6" stroke="#cfe8d5" stroke-width="3" />
            <path d="M14 50h72M42 44v12M50 43v14M58 44v12" stroke="#0e1412" stroke-width="3" stroke-linecap="round" fill="none" />
            <path d="M24 36q26-14 52 0M24 64q26 14 52 0" stroke="#0e1412" stroke-opacity=".35" stroke-width="2" fill="none" />
          </g>
        </svg>
        <div class="shadow"></div>
        <b>LOADING</b>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
